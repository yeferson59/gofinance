name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"

      - name: Install linters
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Format code
        run: |
          go fmt ./...
          golangci-lint --config=.golangci.yaml fmt ./... -v
          goimports -w -v .

      - name: Lint
        run: golangci-lint --config=.golangci.yaml run ./... -v

      - name: Run tests
        run: |
          go test -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Build
        run: go build -v ./...

      - name: Generate release notes
        id: release-notes
        run: |
          chmod +x scripts/release_notes.sh
          body=$(scripts/release_notes.sh)
          body="${body//'%'/'%25'}"
          body="${body//$'\n'/'%0A'}"
          body="${body//$'\r'/'%0D'}"
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$body" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release-notes.outputs.body }}
          draft: false
          prerelease: false
